[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-agents"
version = "0.1.0"
description = "A crypto-oriented multi-agent market research framework inspired by TradingAgents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
crypto-agents = "crypto_trading_agents.cli:main"

[tool.setuptools.packages.find]
include = ["crypto_trading_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
